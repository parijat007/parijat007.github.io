name: Unblock agent

# Hourly (at :25, and after each hourly watch run). Re-runs failed brief/watch/patch-day/deploy runs once, merges the owner's green PRs after a
# one-hour hold window (comment "hold" on a PR or add the `hold` label to stop it), and checks the owner's
# open items (Telegram list on Mondays, reminders three days before a due date). See digest/unblock.py.
# To switch auto-merge off: set the repository variable WF_AUTOMERGE to "off".
on:
  schedule:
    - cron: "25 * * * *"
  # GitHub's own schedule fires late or not at all for new workflows; the hourly watch is kept on time by an
  # external trigger, so also run after each watch run. The agent skips itself if it ran in the last 40 min.
  workflow_run:
    workflows: ["Hourly watch"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: unblock
  cancel-in-progress: false

jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write            # merge green PRs
      pull-requests: write       # the hold-window comment
      actions: write             # re-run failed jobs, dispatch the deploy
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.lock
      - env:
          GITHUB_TOKEN:        ${{ github.token }}
          WF_AUTOMERGE:        ${{ vars.WF_AUTOMERGE || 'on' }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          # presence only, to tick off the owner's to-do list; values are never printed
          AWS_BACKUP_ROLE_ARN: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
          NVD_API_KEY:         ${{ secrets.NVD_API_KEY }}
          VULNCHECK_API_KEY:   ${{ secrets.VULNCHECK_API_KEY }}
        run: python -m digest.unblock
