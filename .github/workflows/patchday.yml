name: Patch Tuesday

# Microsoft publishes on the second Tuesday, around 17:00-18:00 UTC. This runs every Tuesday and the
# script acts only on the second one, once (data/patchday/<month>.json marks it sent).
on:
  schedule:
    - cron: "40 18 * * 2"
    - cron: "40 20 * * 2"     # retry, in case Microsoft published late
  workflow_dispatch:
    inputs:
      month:
        description: "Month id, e.g. 2026-Nov (blank = this month, only on Patch Tuesday)"
        type: string
        default: ""
      inspect:
        description: "Print the record's structure only"
        type: boolean
        default: false
      dry_run:
        description: "Print only: no Telegram, no commit"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  patchday:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.lock
      - name: Summarize
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          MONTH: ${{ inputs.month }}
          DRY: ${{ inputs.dry_run }}
          INSPECT: ${{ inputs.inspect }}
        run: |
          args=()
          [ -n "$MONTH" ] && args+=(--month "$MONTH")
          [ "$DRY" = "true" ] && args+=(--dry-run)
          [ "$INSPECT" = "true" ] && args+=(--inspect)
          python tools/patchday.py "${args[@]}"
      - name: Commit
        if: ${{ !inputs.dry_run }}
        env:
          MONTH: ${{ inputs.month }}
        run: |
          git config user.name  "watchfloor-bot"
          git config user.email "watchfloor-bot@users.noreply.github.com"
          git add data/patchday
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "patch tuesday: ${MONTH:-$(date -u +%Y-%b)}"
          git pull --rebase --autostash -X theirs && git push
