name: Self-test (all models, no publishing)

# Run by hand from the Actions tab, or weekly. Pings every configured model, writes one
# full brief per provider in memory and validates it, and checks Telegram credentials.
# Sends no messages and commits nothing. The report is on the run's Summary page.
on:
  pull_request:
    paths: ["digest/post_judge.py", "tests/judge_cases.json", "digest/linkedin.py", "digest/linkedin_example.txt"]
  workflow_dispatch:
    inputs:
      quick:
        description: "Pings only (skip the full brief per provider)"
        type: boolean
        default: false
      providers:
        description: "Comma-separated providers to test"
        type: string
        default: "gemini,groq,cloudflare,openrouter"
      channel_welcome:
        description: "Only post the Telegram channel's welcome message (skips the model tests)"
        type: boolean
        default: false
  schedule:
    - cron: "40 16 * * 1"    # Mondays 16:40 UTC, after the morning brief; pings only (saves Gemini quota)

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.lock
      - name: Telegram channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WELCOME: ${{ inputs.channel_welcome }}
        run: |
          if [ "$WELCOME" = "true" ]; then python -m digest.channel --welcome; else python -m digest.channel || echo "::warning::channel check failed"; fi
      - name: Self-test
        if: ${{ !inputs.channel_welcome }}
        env:
          WF_LLM_CHAIN:       ${{ inputs.providers || 'gemini,groq,cloudflare,openrouter' }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NVD_API_KEY:        ${{ secrets.NVD_API_KEY }}
          VULNCHECK_API_KEY:  ${{ secrets.VULNCHECK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_APIKEY:   ${{ secrets.CALLMEBOT_APIKEY }}
          TEAMS_WEBHOOK_URL:  ${{ secrets.TEAMS_WEBHOOK_URL }}
          QUICK:              ${{ github.event_name != 'workflow_dispatch' || inputs.quick }}
        run: |
          if [ "$QUICK" = "true" ]; then python -m digest.selftest --quick; else python -m digest.selftest; fi
      - name: Second-model check (sample brief, live model)
        if: ${{ !inputs.channel_welcome }}
        env:
          WF_LLM_CHAIN:       ${{ inputs.providers || 'gemini,groq,cloudflare,openrouter' }}
          WF_VERIFY_AS_WRITER: gemini
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m digest.verify
      - name: LinkedIn judge (three real drafts with known verdicts, live model)
        if: ${{ !inputs.channel_welcome }}
        env:
          WF_LLM_CHAIN:       ${{ inputs.providers || 'gemini,groq,cloudflare,openrouter' }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m digest.post_judge
      - name: LinkedIn draft from the latest note (live models, nothing posted or sent)
        if: ${{ !inputs.channel_welcome }}
        env:
          WF_LLM_CHAIN:       ${{ inputs.providers || 'gemini,groq,cloudflare,openrouter' }}
          WF_LINKEDIN_DIR:    ${{ runner.temp }}/linkedin
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m digest.linkedin draft --from note --no-notify
