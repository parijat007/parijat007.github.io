name: Self-test (all models, no publishing)

# Run by hand from the Actions tab, or weekly. Pings every configured model, writes one
# full brief per provider in memory and validates it, and checks Telegram credentials.
# Sends no messages and commits nothing. The report is on the run's Summary page.
on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Pings only (skip the full brief per provider)"
        type: boolean
        default: false
      providers:
        description: "Comma-separated providers to test"
        type: string
        default: "gemini,groq,mistral,cloudflare,openrouter"
  schedule:
    - cron: "40 16 * * 1"    # Mondays 16:40 UTC, after the morning brief; pings only (saves Gemini quota)

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Self-test
        env:
          WF_LLM_CHAIN:       ${{ inputs.providers || 'gemini,groq,mistral,cloudflare,openrouter' }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY:       ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NVD_API_KEY:        ${{ secrets.NVD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_APIKEY:   ${{ secrets.CALLMEBOT_APIKEY }}
          TEAMS_WEBHOOK_URL:  ${{ secrets.TEAMS_WEBHOOK_URL }}
          QUICK:              ${{ inputs.quick || github.event_name == 'schedule' }}
        run: |
          if [ "$QUICK" = "true" ]; then python -m digest.selftest --quick; else python -m digest.selftest; fi
