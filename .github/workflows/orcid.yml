name: ORCID sync

# Weekly: public works from the ORCID record into data/orcid.json. The site lists any work not already in
# site/profile.yaml (matched by DOI or title); the hand-kept list stays authoritative.
on:
  schedule:
    - cron: "41 7 * * 1"     # Mondays 07:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write          # commit data/orcid.json
    outputs:
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.lock
      - run: python tools/orcid_sync.py
      - id: c
        name: Commit
        run: |
          before=$(git rev-parse HEAD)
          tools/publish.sh "orcid: $(date -u +%F)"
          if [ "$(git rev-parse HEAD)" = "$before" ]; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"

  deploy:                      # a push made with the workflow token does not start other workflows
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions: { contents: read, pages: write, id-token: write, attestations: write }
