name: Hourly watch

on:
  schedule:
    - cron: "15 * * * *"     # every hour at :15 UTC
  workflow_dispatch:

permissions:
  contents: write            # commit data/watch.json

concurrency:
  group: data-writer         # never two jobs pushing data at once
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.lock
      - name: Update watch (no LLM)
        env:
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY:      ${{ secrets.NVD_API_KEY }}
          CALLMEBOT_PHONE:  ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m digest.watch
      - name: Commit data
        run: |
          git config user.name  "watchfloor-bot"
          git config user.email "watchfloor-bot@users.noreply.github.com"
          git add data/watch.json
          git diff --cached --quiet && exit 0
          git commit -m "watch: $(date -u +%FT%H:%MZ)"
          # watch.json is rebuilt in full on every run, so if another run pushed first,
          # keep this run's newer copy instead of failing on a merge conflict
          git pull --rebase --autostash -X theirs && git push
      - name: Dead-man's switch
        if: success() && env.HC_URL != ''
        env: { HC_URL: "${{ secrets.HEALTHCHECK_URL_WATCH }}" }
        run: curl -fsS -m 10 "$HC_URL" > /dev/null

  deploy:
    needs: watch
    uses: ./.github/workflows/pages.yml
    permissions: { contents: read, pages: write, id-token: write, attestations: write }
