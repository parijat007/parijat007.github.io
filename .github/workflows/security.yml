name: Security checks

# Secret scan, dependency audit and workflow lint on every change, plus a weekly
# full-history scan and a daily check that the live site is the one we deployed.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "state/**", "archive/**"]
  pull_request:
  schedule:
    - cron: "17 9 * * *"     # daily 09:17 UTC: live-site integrity + dependency audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit==2.9.0
      - run: pip-audit --require-hashes -r requirements.lock

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: pip install actionlint-py==1.7.12.25 && actionlint -color

  live-site:                 # daily / by hand only: on a push it would race the deploy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/site_check.py
      - name: Brief ledger is unbroken (hash chain matches every published brief)
        run: python -m digest.ledger verify
      - name: Live build.json carries a valid Sigstore attestation from this repo's pages workflow
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS --retry 3 https://theparijat.com/build.json -o live-build.json
          gh attestation verify live-build.json -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/pages.yml"
