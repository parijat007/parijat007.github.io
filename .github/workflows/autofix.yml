name: Fixer agent

# When a build or test fails on main, reproduce it, ask a free model for a small fix, prove it with the full
# test suite and open a PR labelled `autofix` (never merged automatically). If it cannot fix it safely, it opens
# one issue per failure and tells the owner on Telegram. See tools/autofix.py for the guardrails.
on:
  workflow_run:
    workflows: ["Hourly watch", "Build and deploy site", "CI", "KEV trends", "Cloud brief (Mac offline backup)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id: { description: "A failed workflow run id", required: true, type: string }
      dry_run: { description: "Diagnose and test only, push nothing", type: boolean, default: true }
      ref: { description: "Branch to reproduce on (testing the fixer; anything but main forces a dry run)", type: string, default: main }

permissions: {}

concurrency:
  group: autofix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # push the autofix/<signature> branch (never main)
      pull-requests: write     # open the PR
      issues: write            # "could not fix" issue, once per failure
      actions: read            # read the failed run's logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.ref || 'main' }}", persist-credentials: false }   # the token is used only for the final push
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - run: |
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-tools.lock
          pip install --require-hashes -r requirements-e2e.lock && python -m playwright install --with-deps chromium
      - env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          RUN_ID:             ${{ inputs.run_id || github.event.workflow_run.id }}
          WF_JOB:             fixer
          WF_JOB_PRIORITY:    background   # Gemini last: its daily quota is kept for the brief
          DRY:                ${{ (inputs.dry_run || (inputs.ref && inputs.ref != 'main')) && '1' || '' }}
          WF_LLM_CHAIN:       gemini,groq,zai,openrouter,cloudflare
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY:        ${{ secrets.ZAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/autofix.py --run-id "$RUN_ID" ${DRY:+--dry-run}
