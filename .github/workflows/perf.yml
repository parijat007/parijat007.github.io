name: Performance

# Daily: Lighthouse audit of the live site + pipeline health from the Actions API and brief metadata.
# Writes data/perf.json and data/perf_history.json; Telegram alert when a threshold is crossed.
on:
  schedule:
    - cron: "47 16 * * *"    # 16:47 UTC, after the morning brief
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # commit data/perf*.json
      actions: read            # run durations and schedule delay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.lock
      - name: Lighthouse (live site)
        run: |
          mkdir -p lh
          for page in home:/ today:/today/ watch:/watch/; do
            name="${page%%:*}"; path="${page#*:}"
            npx --yes lighthouse@13.6.0 "https://theparijat.com${path}" --quiet \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output-path="lh/${name}.json" || echo "::warning::lighthouse failed for ${path}"
          done
      - name: Report
        env:
          GITHUB_TOKEN:       ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/perf_report.py lh
      - name: Commit
        run: |
          git config user.name  "watchfloor-bot"
          git config user.email "watchfloor-bot@users.noreply.github.com"
          git add data/perf.json data/perf_history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "perf: $(date -u +%F)"
          git pull --rebase --autostash -X theirs && git push
