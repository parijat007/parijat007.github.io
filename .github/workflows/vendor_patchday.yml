name: Oracle and Cisco patch days

# Oracle: third Tuesday of every month, around 20:00 UTC (quarterly CPU or monthly CSPU); acts once.
# Cisco: daily check of the previous day; an edition only when a bundle of new advisories was released.
# Facts-only, from the vendors' CSAF files (tools/csaf_patchday.py).
on:
  schedule:
    - cron: "40 21 * * 2"     # Oracle
    - cron: "40 23 * * 2"     # Oracle retry, in case it published late
    - cron: "13 6 * * *"      # Cisco, previous UTC day
  pull_request:                # live smoke test (dry run) when this code changes
    paths: ["tools/csaf_patchday.py", ".github/workflows/vendor_patchday.yml"]
  workflow_dispatch:
    inputs:
      vendor:
        type: choice
        options: [oracle, cisco]
        default: oracle
      month:
        description: "Oracle release month, e.g. 2026-Nov (blank = today, release day only)"
        type: string
        default: ""
      day:
        description: "Cisco publication day, YYYY-MM-DD (blank = yesterday)"
        type: string
        default: ""
      dry_run:
        description: "Print only: no Telegram, no commit"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.lock
      - name: Oracle, November (CSPU) and October (CPU)
        env: { NVD_API_KEY: "${{ secrets.NVD_API_KEY }}" }
        run: |
          python tools/csaf_patchday.py oracle --month 2026-Nov --dry-run
          python tools/csaf_patchday.py oracle --month 2026-Oct --dry-run
      - name: Cisco, last 7 days (any day with new advisories)
        run: |
          for i in 1 2 3 4 5 6 7; do
            python tools/csaf_patchday.py cisco --day "$(date -u -d "-$i day" +%F)" --min-advisories 1 --dry-run
          done

  edition:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # commit data/patchday
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.lock
      - name: Summarize
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          NVD_API_KEY:        ${{ secrets.NVD_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          VENDOR: ${{ inputs.vendor }}
          MONTH: ${{ inputs.month }}
          DAY: ${{ inputs.day }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ -z "$VENDOR" ]; then
            if [ "$SCHEDULE" = "13 6 * * *" ]; then VENDOR=cisco; else VENDOR=oracle; fi
          fi
          args=("$VENDOR")
          [ -n "$MONTH" ] && args+=(--month "$MONTH")
          [ -n "$DAY" ] && args+=(--day "$DAY")
          [ "$DRY" = "true" ] && args+=(--dry-run)
          python tools/csaf_patchday.py "${args[@]}"
      - name: Commit
        if: ${{ inputs.dry_run != true }}
        run: |
          tools/publish.sh "patch day: $(date -u +%F)"
