name: Parijat Sharma
brand: Watchfloor
site_title: Parijat Sharma — Cloud Detection & Response | Watchfloor
headline: Lead Cyber Security Architect. Cloud detection and response, identity-first Zero Trust, and security governance for agentic AI.
location: New Jersey, USA
intro: >
  I lead detection and response engineering for cloud-first enterprises: telemetry engineering,
  detection-as-code mapped to MITRE ATT&CK, incident response and adversary simulation, and
  identity-first Zero Trust across AWS, Azure and GCP.
  My published frameworks treat detections as governed, testable assets and set guardrails for
  autonomous AI agents in the SOC. Twenty-plus years across financial services, media, healthcare,
  transportation and critical infrastructure.
watchfloor_blurb: >
  Watchfloor is my public service for defenders: an hourly watch of newly exploited vulnerabilities
  and vendor advisories, and a daily brief that ranks what matters, with a patch action and a hunting
  focus for each item. Every claim links to its source.

niches:
  - title: Cloud detection and response engineering
    detail: Telemetry pipelines, detection-as-code and SIEM/SOAR integration across AWS, Azure and GCP control planes.
  - title: Identity-first Zero Trust
    detail: Entra ID, Okta and SailPoint governance; conditional access and privileged paths designed around blast radius.
  - title: Agentic AI security governance
    detail: Scoping, guardrails and audit for autonomous agents; delegated-authority controls for multi-agent LLM systems.
  - title: Incident response and adversary simulation
    detail: IR playbooks, tabletop exercises and post-incident review; red team and intelligence-driven testing tied to remediation.
  - title: Multi-cloud security architecture
    detail: Secure landing zones, policy-as-code guardrails and reference patterns for regulated workloads.
  - title: Kubernetes and IaC security
    detail: AKS and EKS runtime security, admission control, and IaC scanning built into the delivery pipeline.
  - title: GenAI and LLM application security
    detail: Threat modeling LLM applications against OWASP Top 10 for LLMs and MITRE ATLAS, including prompt injection through voice and tool channels.

# Original frameworks. `stages` renders as a sequence, so list them in order.
frameworks:
  - name: Detection Lifecycle Codex
    short: DLC
    summary: A stage-gated lifecycle that governs each detection as a versioned, tested asset. Its key output is an authorization class (advisory, human-gated or bounded autonomous response) rather than a severity label.
    stages: [Use case, Telemetry contract, Logic design, Adversarial validation, Confidence calibration, Authorization class, Runtime assurance, Retirement]
    paper: "https://doi.org/10.63282/3050-9262.IJAIDSML-V7I3P111"
  - name: Agentic Security Governance Framework
    short: ASGF
    summary: A governance model for autonomous AI actions in the SOC, from classifying an agent's authority to recovering from a bad action.
    stages: [Classify, Scope, Guardrail, Audit, Recover]
    paper: "https://doi.org/10.63282/3050-9262.IJAIDSML-V7I3P111"
  - name: Telemetry Detection Readiness
    short: TDR
    summary: A measurement model that treats detection readiness as a design property of a telemetry pipeline, backed by a twelve-stage pipeline design method and a seven-layer cross-cloud signal taxonomy.
    dims: [Coverage supportability, Signal fidelity, Semantic consistency, Temporal integrity, Schema stability]
    paper: "https://doi.org/10.70917/ijcisim-2026-4984"
  - name: "[Confirm full name] (IACSP)"
    short: IACSP
    summary: Repositions enterprise identity infrastructure as an active detection and containment surface rather than a passive access-governance system.
    stages: [Observe, Detect, Contain, Recover]
    confirm: true      # two expansions appear in past drafts; confirm which is correct
  - name: AI-Era Cyber Immunity Framework
    short: ACIF
    summary: A ten-pillar operating model for organisations responding to AI-accelerated vulnerability discovery.
    confirm: true      # confirm the expansion; another draft used a different name
  - name: Delegated Authority Laundering
    short: DAL
    summary: Formalises how authority leaks through natural-language handoffs between LLM agents, extending the confused-deputy problem, with an intersection-of-scope permission model as the control.
    confirm: true      # confirm you want this listed as a framework

