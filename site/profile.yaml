    detail: Telemetry pipelines, detection-as-code and SIEM/SOAR integration across AWS, Azure and GCP control planes.
  - title: Identity-first Zero Trust
    detail: Entra ID, Okta and SailPoint governance; conditional access and privileged paths designed around blast radius.
  - title: Multi-cloud security architecture
    detail: Secure landing zones, policy-as-code guardrails and reference patterns for regulated workloads.
  - title: Kubernetes and IaC security
    detail: AKS and EKS runtime security, admission control, and IaC scanning built into the delivery pipeline.
  - title: GenAI and LLM application security
    detail: Threat modeling LLM applications and agents against OWASP Top 10 for LLMs and MITRE ATLAS; local-model security tooling.
  - title: Regulated enterprise resilience
    detail: HIPAA, PCI DSS, SOC 2 and GDPR controls mapped to architecture decisions, using SABSA and TOGAF.

