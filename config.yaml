# Watchfloor — configuration. Sources live in sources.yaml; profile in site/profile.yaml.
# Edit freely; no code changes needed.

window_hours: 30            # look-back window; 30h absorbs schedule jitter. Use 72 on Mondays (auto, see weekend_hours)
weekend_hours: 78           # used on Mondays so Fri–Sun items are not missed
repeat_suppression_days: 7  # IDs reported within this many days are suppressed unless status changed
max_items_to_llm: 40        # pre-ranked cap on items sent to the model (token control)

# Analyst model chain. First provider that answers wins; if all fail, a facts-only brief is published.
# On the Mac: local -> gemini -> groq -> openrouter.  In GitHub Actions: WF_LLM_CHAIN=gemini,groq,openrouter
llm:
  chain: [local, gemini, github, groq, cloudflare, openrouter]
  providers:
    local:          # llama.cpp llama-server on the M1 Max. $0, nothing leaves the machine.
      base_url: http://127.0.0.1:8080/v1
      model: local
      label: Qwen3.6-35B-A3B (local)
      json: schema          # grammar-constrained JSON
      no_think: true
      max_items: 40
      max_text_chars: 400
      timeout_seconds: 1800
    gemini:         # Google AI Studio free tier (no card). Key: aistudio.google.com/apikey
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      # First that answers wins. Busy or slow models are skipped (503/429/timeout), so keep a
      # lighter model near the end as the reliable floor. Run the Self-test workflow to see
      # which models this key can use today.
      # Free tier: 20 requests/day per model per project (resets midnight Pacific), so each model is
      # its own small budget. Alias gemini-flash-latest last: it points at one of the models above.
      models: [gemini-3.8-flash, gemini-3.6-flash, gemini-3.5-flash, gemini-3.5-flash-lite, gemini-flash-latest]
      label: Gemini Flash (free tier)
      api_key_env: [GEMINI_API_KEY]
      json: object
      reasoning_effort: low       # hidden "thinking" tokens count against max_tokens; keep them small
      max_output_tokens: 12000
      max_items: 40
      max_text_chars: 400
      timeout_seconds: 75         # per model; a healthy Gemini Flash answers in ~15 s
    github:         # GitHub Models: OpenAI GPT models, free and rate-limited, through your GitHub account. In Actions the
                    # built-in token works (job permission models: read); on the Mac it is optional (Keychain
                    # github-models-token, a fine-grained token with only "Models: read"). Small request limits:
                    # keep inputs short.
      base_url: https://models.github.ai/inference
      models: [openai/gpt-4.1, openai/gpt-4.1-mini, openai/gpt-4o-mini]
      label: GitHub Models (OpenAI, free tier)
      headers: {Accept: application/vnd.github+json, X-GitHub-Api-Version: "2022-11-28"}   # without these: "OK" in plain text
      api_key_env: [GITHUB_MODELS_TOKEN, GITHUB_TOKEN]
      json: object
      max_items: 15
      max_text_chars: 250
      max_output_tokens: 3500
      timeout_seconds: 120
    groq:           # Groq free tier (no card). Key: console.groq.com/keys. ~8K tokens/min, so a smaller input
      base_url: https://api.groq.com/openai/v1
      models: [openai/gpt-oss-120b]
      label: gpt-oss-120b (Groq free tier)
      api_key_env: [GROQ_API_KEY]
      json: object
      max_items: 12
      max_text_chars: 200
      max_output_tokens: 2500
      reasoning_effort: low   # gpt-oss otherwise spends most of the budget on hidden reasoning
      timeout_seconds: 120
    cloudflare:     # Cloudflare Workers AI free allocation: 10,000 neurons/day (~10 briefs), no card, no training.
      base_url: https://api.cloudflare.com/client/v4/accounts/{CLOUDFLARE_ACCOUNT_ID}/ai/v1
      models: ["@cf/openai/gpt-oss-120b", "@cf/openai/gpt-oss-20b"]   # a retired model (HTTP 410) is skipped
      label: Cloudflare Workers AI (free allocation)
      api_key_env: [CLOUDFLARE_API_TOKEN]
      json: object
      reasoning_effort: low
      max_items: 30
      max_text_chars: 300
      max_output_tokens: 6000
      timeout_seconds: 150
    openrouter:     # OpenRouter free models (no card, ~50 requests/day). Key: openrouter.ai/keys
      base_url: https://openrouter.ai/api/v1
      models: [openrouter/free]          # last resort; discovered free models are tried first
      discover_free: true                # pick current :free models with JSON output and no hidden reasoning
      label: OpenRouter free router
      api_key_env: [OPENROUTER_API_KEY]
      json: object
      max_items: 30
      max_text_chars: 300
      max_output_tokens: 8000          # headroom if a model reasons despite the switch below
      extra_body: {reasoning: {enabled: false}}   # free models that can think answer directly instead
      max_output_tokens: 8000
      extra_body: {reasoning: {effort: low, exclude: true}}   # free routed models may "think" first
      timeout_seconds: 180
site:
  url: "https://theparijat.com"

# Products/platforms you care about. Items touching these rank higher and get tagged.
stack_watchlist:
  - AWS
  - Azure
  - Entra ID
  - Microsoft 365
  - GCP
  - Okta
  - Kubernetes
  - GitHub Actions
  - Palo Alto
  - Fortinet
  - Cisco
  - Citrix
  - Ivanti
  - VMware
  - CrowdStrike
  - Splunk
  - Terraform
  - Docker
  - npm
  - PyPI
  - LLM

# NVD: critical CVEs published inside the window
nvd:
  enabled: true
  severities: [CRITICAL]
  max_results: 40

# GitHub Security Advisories (reviewed)
ghsa:
  enabled: true
  severities: [critical, high]
  max_results: 30

# GitHub repo discovery: new repos with traction in these topics
github_repos:
  enabled: true
  created_within_days: 14
  min_stars: 40
  max_per_query: 8
  queries:
    - "topic:detection-engineering"
    - "topic:threat-hunting"
    - "topic:cloud-security"
    - "topic:kubernetes-security"
    - "topic:incident-response"
    - "topic:llm-security"
    - "topic:sigma"
    - "topic:red-team"

max_entries_per_feed: 15   # feeds live in sources.yaml

# Delivery
delivery:
  channels: [callmebot, telegram, teams]   # unconfigured channels are skipped automatically
  callmebot_max_chars: 1400 # CallMeBot uses GET; keep chunks small so the URL stays short
  telegram_max_chars: 3800
  telegram_channel: "@watchfloor_watch"   # public channel handle, e.g. "@watchfloor" (bot must be an admin); empty = off
  pause_seconds: 4          # gap between WhatsApp messages
  on_failure_alert: true    # send a one-line alert if the run fails

# Hourly Watch (deterministic, runs on GitHub Actions)
watch:
  lookback_hours: 48
  retain_days: 7
  alert_on_stack_kev: true

# LinkedIn agent (python -m digest.linkedin). Drafts only; publishing needs your explicit approval.
linkedin:
  api_version: "202608"          # LinkedIn-Version header (YYYYMM)
  redirect_port: 8766            # must match the redirect URL in your LinkedIn app
  never_name: [Hearst, Morgan Stanley, Merrill, "Johnson & Johnson", Ford, MTA]   # drafts naming these are blocked

# Comments (giscus: GitHub Discussions, GitHub sign-in). Off until category_id is filled in: enable
# Discussions on the repo, add a "Comments" category (Announcement type, so only giscus/you start threads),
# install https://github.com/apps/giscus on this repo, then copy the category id from https://giscus.app.
comments:
  repo: parijat007/parijat007.github.io
  repo_id: R_kgDOV2z48A
  category: Comments
  category_id: "DIC_kwDOV2z48M4DMCqk"
